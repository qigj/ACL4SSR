[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位

ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

ruleset=💬 Ai平台,[]GEOSITE,openai
ruleset=💬 Ai平台,[]GEOSITE,anthropic
ruleset=💬 Ai平台,[]GEOSITE,google-gemini
ruleset=💬 Ai平台,[]GEOSITE,category-ai-!cn
ruleset=📢 谷歌FCM,[]GEOSITE,google
ruleset=📢 谷歌FCM,[]GEOSITE,google-cn

ruleset=📲 电报消息,[]GEOSITE,telegram
ruleset=📲 电报消息,[]GEOIP,telegram
ruleset=🎥 国外媒体,[]GEOSITE,youtube
ruleset=🎥 国外媒体,[]GEOSITE,netflix
ruleset=🎥 国外媒体,[]GEOSITE,disney
ruleset=🎥 国外媒体,[]GEOSITE,hbo
ruleset=🎥 国外媒体,[]GEOSITE,primevideo
ruleset=🎥 国外媒体,[]GEOSITE,twitch
ruleset=🎥 国外媒体,[]GEOSITE,spotify
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple

ruleset=节点选择,[]GEOSITE,gfw
ruleset=🎯 全球直连,[]GEOSITE,tracker
ruleset=🎯 全球直连,[]GEOIP,cn
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn

ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位

;设置分组标志位
custom_proxy_group=节点选择`select`[]自动选择`[]手动选择`[]企业域名`[]教育域名`[]按运营商`[]大佬维护`[]官方域名`[]亚洲域名`[]优选IP`[]优选域名`[]中国`[]外国`[]DIRECT
custom_proxy_group=手动选择`select`.*
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`3600,,50
